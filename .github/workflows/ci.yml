name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scheduletm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduletm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3003
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scheduletm_ci
      DATABASE_PUBLIC_URL: postgres://postgres:postgres@localhost:5432/scheduletm_ci
      WEBHOOK_SECRET: ci-only-webhook-secret-not-used-in-production
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to isolated test database
        run: npm run -w @scheduletm/server migrate:latest

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Web unit tests
        run: npm run -w @scheduletm/web test:unit

      - name: Build
        run: npm run build
